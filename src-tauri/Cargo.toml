[package]
name = "deskody"
version = "0.1.9"
description = "Context-aware, local-first music automation"
authors = ["Deskody"]
edition = "2021"
rust-version = "1.91"

[lib]
name = "deskody"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deskody"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = "0.8"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "System", "Media_Control", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
zbus = { version = "5", features = ["blocking-api"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
