name: Desktop checks and packages
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm run extension:build
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Browser and extension tests
        if: runner.os == 'Linux'
        run: npm run test:e2e
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run test:rust
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build native installer
        run: npm run bundle -- --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Archive macOS app with executable permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Deskody.app" "src-tauri/target/release/bundle/macos/Deskody.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: deskody-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.zip
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
